<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>会議運営ツール（パスワード保護）</title>
<style>
  :root{
    --bg:#F6F7FB; --surface:#FFFFFF; --ink:#182A4D; --ink-soft:#54607D;
    --accent:#1F3E77; --accent-2:#122A52; --pink:#E63888; --border:#E4E7F0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:linear-gradient(160deg,var(--accent-2),var(--accent) 60%,#3D63A8);
    font-family:-apple-system,"Noto Sans JP",sans-serif; display:flex; align-items:center; justify-content:center;}
  .card{
    background:#fff; border-radius:16px; padding:36px 32px; width:100%; max-width:380px;
    box-shadow:0 20px 60px rgba(10,20,40,.35); text-align:center;
  }
  .lock{font-size:34px; margin-bottom:6px;}
  h1{font-size:16px; margin:0 0 6px; color:var(--ink); font-weight:700;}
  p{font-size:12.5px; color:var(--ink-soft); margin:0 0 20px; line-height:1.6;}
  input{
    width:100%; border:1px solid var(--border); border-radius:9px; padding:12px 14px; font-size:14px;
    margin-bottom:12px; text-align:center; letter-spacing:.05em;
  }
  input:focus{outline:none; border-color:var(--pink);}
  button{
    width:100%; border:none; background:var(--accent); color:#fff; padding:12px; border-radius:9px;
    font-size:14px; font-weight:700; cursor:pointer;
  }
  button:hover{background:var(--accent-2);}
  .err{color:#C23A3A; font-size:12px; margin-top:10px; min-height:16px;}
  .badge{
    display:inline-block; font-size:10px; font-weight:700; color:var(--pink); background:#FCE6F0;
    border:1px solid #F6B9D6; padding:3px 9px; border-radius:999px; margin-bottom:14px; letter-spacing:.04em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="lock">🔒</div>
  <div class="badge">社内限定・閲覧用</div>
  <h1>会議運営ツール</h1>
  <p>パスワードを入力してください。<br>閲覧後は画面を離れる際にタブを閉じることを推奨します。</p>
  <input type="password" id="pw" placeholder="パスワード" autocomplete="off">
  <button onclick="tryDecrypt()">開く</button>
  <div class="err" id="err"></div>
</div>

const ITERATIONS = 250000;

function b64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return buf.buffer;
}

async function tryDecrypt(){
  const pwEl = document.getElementById('pw');
  const errEl = document.getElementById('err');
  errEl.textContent = '';
  const password = pwEl.value;
  if(!password){ errEl.textContent = 'パスワードを入力してください。'; return; }
  try{
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      'raw', enc.encode(password), {name:'PBKDF2'}, false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: b64ToBuf(SALT_B64), iterations: ITERATIONS, hash:'SHA-256' },
      keyMaterial,
      { name:'AES-GCM', length:256 },
      false,
      ['decrypt']
    );
    const plainBuf = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv: b64ToBuf(IV_B64) },
      key,
      b64ToBuf(CT_B64)
    );
    const html = new TextDecoder().decode(plainBuf);
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    errEl.textContent = 'パスワードが正しくありません。';
  }
}
document.getElementById('pw').addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryDecrypt(); });
</script>
